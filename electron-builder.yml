appId: dev.pi-harness.app
productName: Pi-Harness
copyright: Copyright © 2026 wangmiao
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.{map,d.ts}'
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: NOTICE
    to: NOTICE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: resources/builtin-skills
    to: builtin-skills
asarUnpack: []
mac:
  category: public.app-category.developer-tools
  # Default: host arch only. Building arm64+x64 leaves two unpacked .app
  # folders under release/ which Spotlight indexes as duplicate apps.
  # Use `pnpm build:mac:all` when you need both DMGs for release.
  target:
    - target: dmg
      arch:
        - arm64
    # MacUpdater installs from the ZIP payload; DMG remains the manual installer.
    - target: zip
      arch:
        - arm64
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    CFBundleDisplayName: Pi-Harness
    CFBundleName: Pi-Harness
win:
  # Keep local filenames identical to the GitHub upload names.
  artifactName: ${productName}-Setup-${version}.${ext}
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
  icon: build/icon.png
  maintainer: wangmiao <tuziling84@gmail.com>
publish:
  provider: github
  owner: wangmiaozero
  repo: pi-harness
  releaseType: release
