appId: dev.pi-harness.app
productName: Pi-Harness
copyright: Copyright © 2026 wangmiao
directories:
  output: release
  buildResources: build
files:
  - from: out
    to: out
    filter:
      - main/**/*
      - preload/**/*
      - renderer/**/*
  - '!release{,/**/*}'
  - '!task{,/**/*}'
  - '!**/.release-keys{,/**/*}'
  - '!**/*.{pem,key,p8,p12,pfx,keystore}'
  - package.json
  - '!**/*.{map,d.ts}'
  # Keep only the matching macOS Native Pi TUI addon in each package.
  - '!node_modules/@earendil-works/pi-tui/native/darwin/prebuilds/!(darwin-${arch}){,/**/*}'
extraResources:
  - from: resources/release-policy.json
    to: release-policy.json
  - from: resources/desktop-extension
    to: desktop-extension
    filter:
      - '**/*.mjs'
  - from: resources/archify
    to: archify
  - from: build/app-icons
    to: app-icons
  - from: LICENSE
    to: LICENSE
  - from: NOTICE
    to: NOTICE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: resources/builtin-skills
    to: builtin-skills
  - from: resources/petpacks
    to: petpacks
beforePack: scripts/runtime/before-pack.mjs
afterPack: scripts/runtime/after-pack.mjs
afterSign: scripts/release/after-sign.mjs
asarUnpack: []
mac:
  extraResources:
    - from: resources/runtimes/darwin-${arch}
      to: runtimes
  # Pi is signed and content-verified by afterPack; retain Node's official signature.
  signIgnore:
    - /runtimes/
  category: public.app-category.developer-tools
  # Default: host arch only. Building arm64+x64 leaves two unpacked .app
  # folders under release/ which Spotlight indexes as duplicate apps.
  # Use `pnpm build:mac:all` when you need both DMGs for release.
  target:
    - dmg
    # MacUpdater installs from the ZIP payload; DMG remains the manual installer.
    - zip
  icon: build/icon.icns
  hardenedRuntime: true
  identity: '-'
  notarize: false
  entitlements: build/entitlements.community.plist
  entitlementsInherit: build/entitlements.community.plist
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: Pi-Harness uses your microphone for realtime voice conversations.
    CFBundleDisplayName: Pi-Harness
    CFBundleName: Pi-Harness
dmg:
  # The DMG is the manual installer; users verify it via SHA256SUMS.
  # Differential updates use the ZIP payload (Squirrel.Mac), so the
  # DMG blockmap is dead weight — collect/verify/publish all treat it as optional.
  writeUpdateInfo: false
  iconSize: 128
  contents:
    - x: 120
      y: 184
    - x: 400
      y: 184
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
win:
  extraResources:
    - from: resources/runtimes/win32-${arch}
      to: runtimes
  # Keep local filenames identical to the GitHub upload names.
  artifactName: ${productName}-Setup-${version}.${ext}
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  extraResources:
    - from: resources/runtimes/linux-${arch}
      to: runtimes
  target:
    - AppImage
  category: Development
  icon: build/icon.png
  maintainer: wangmiao <tuziling84@gmail.com>
publish:
  provider: github
  owner: wangmiaozero
  repo: pi-harness
  releaseType: release
