name: Watcher native regression
on: push
permissions:
  contents: read
jobs:
  watcher:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.12.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Old-code negative control
        run: node scripts/watcher-native-control.mjs
      - name: Fixed-code native unit and integration
        run: pnpm exec vitest run src/main/workspace/workspace-watcher-service.test.ts src/main/workspace/workspace-watcher-service.integration.test.ts --maxWorkers=2 --reporter=default --reporter=json --outputFile=out/watcher-native.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: watcher-${{ matrix.os }}
          path: out/watcher-native.json
