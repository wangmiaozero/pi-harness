name: CI / Windows regression validation
on:
  push:
    branches: [codex/windows-regressions-410000]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows unit and integration (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PI_HARNESS_REQUIRE_RUNTIME_TESTS: '1'
      PI_HARNESS_EXPECTED_ARCH: ${{ matrix.arch }}
      npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
      npm_config_electron_custom_dir: 'v{{ version }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.12.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .runtime-cache
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: downloads-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml', 'src/main/runtime/catalog.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm runtime:prepare
      - run: pnpm runtime:check --offline --native
      - name: Complete native unit and integration suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/windows-regressions | Out-Null
          pnpm exec vitest run --maxWorkers=2 --reporter=default --reporter=json --outputFile=out/windows-regressions/tests.json *> out/windows-regressions/tests.log
          $unitExit = $LASTEXITCODE
          Get-Content out/windows-regressions/tests.log
          exit $unitExit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-regressions-${{ matrix.arch }}
          path: out/windows-regressions/
          retention-days: 3
