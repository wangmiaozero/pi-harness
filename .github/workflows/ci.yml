name: CI / Backup recovery validation
on:
  push:
    branches: [codex/backup-recovery-410099]
permissions:
  contents: read
jobs:
  quality:
    name: Linux Electron backup recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
      npm_config_electron_custom_dir: 'v{{ version }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.12.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .runtime-cache
            ~/.cache/electron
          key: downloads-Linux-x64-${{ hashFiles('pnpm-lock.yaml', 'src/main/runtime/catalog.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm runtime:prepare
      - run: pnpm compile
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openbox wmctrl
      - name: CI-order Electron regression and independent recovery repetitions
        run: |
          mkdir -p out/backup-recovery-validation
          xvfb-run -a bash -e -c '
            openbox --sm-disable > /tmp/pi-backup-validation-wm.log 2>&1 &
            for attempt in {1..50}; do
              if wmctrl -m > /dev/null 2>&1; then
                pnpm exec playwright test e2e/agent-settings.spec.ts e2e/app.spec.ts e2e/architecture-layering.spec.ts e2e/backup-recovery.spec.ts --trace=retain-on-failure --output=out/backup-recovery-validation/sequence --reporter=line 2>&1 | tee out/backup-recovery-validation/sequence.log
                test ${PIPESTATUS[0]} -eq 0
                pnpm exec playwright test e2e/backup-recovery.spec.ts --repeat-each=3 --trace=retain-on-failure --output=out/backup-recovery-validation/repeated --reporter=line 2>&1 | tee out/backup-recovery-validation/repeated.log
                test ${PIPESTATUS[0]} -eq 0
                exit 0
              fi
              sleep 0.1
            done
            cat /tmp/pi-backup-validation-wm.log
            exit 1
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: linux-backup-recovery-validation
          path: out/backup-recovery-validation/
          retention-days: 3
