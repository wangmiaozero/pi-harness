name: CI

on:
  push:
    branches: ['codex/ci-41766589201-lock']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-lock:
    name: Native lock phases (Windows-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PI_HARNESS_EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.12.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Original controlled startup must fail at 15 seconds
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          node scripts/storage-lock-probe.mjs original
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run src/main/services/storage.test.ts --maxWorkers=2 --reporter=default --reporter=json --outputFile=out/storage-lock-probe/original.json
          $controlExit = $LASTEXITCODE
          node scripts/storage-lock-probe.mjs verify-original $controlExit
      - name: Fixed fixture with the same controlled startup
        shell: pwsh
        run: |
          node scripts/storage-lock-probe.mjs fixed-delayed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run src/main/services/storage.test.ts --maxWorkers=2 --reporter=default --reporter=json --outputFile=out/storage-lock-probe/fixed-delayed.json
      - name: Restore exact candidate source
        if: always()
        run: node scripts/storage-lock-probe.mjs restore
      - name: Native candidate without instrumentation
        run: pnpm exec vitest run src/main/services/storage.test.ts --maxWorkers=2 --reporter=default --reporter=json --outputFile=out/storage-lock-probe/fixed-native.json
      - uses: ./.github/actions/upload-artifact-retry
        if: always()
        with:
          name: native-lock-phases-${{ matrix.arch }}
          path: out/storage-lock-probe/
