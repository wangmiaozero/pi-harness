name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
  npm_config_electron_custom_dir: 'v{{ version }}'

jobs:
  quality:
    name: Source quality and Electron regression
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec vitest run --maxWorkers=2
      - run: pnpm audit --prod --audit-level high
      - run: pnpm licenses list --prod --json > dependency-licenses.json
      - run: pnpm compile
      - name: Prepare bundled runtimes for Electron features
        run: pnpm runtime:prepare
      - name: Verify pinned SDK and native runtime versions
        run: pnpm runtime:check --offline --native
      - name: Install the Linux window manager
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openbox wmctrl
      - name: Electron regression (SDK compatibility)
        run: |
          xvfb-run -a bash -e -c '
            openbox --sm-disable > /tmp/pi-harness-window-manager.log 2>&1 &
            for attempt in {1..50}; do
              if wmctrl -m > /dev/null 2>&1; then
                native_views="renders an interactive architecture map|explores all map pages"
                pnpm test:e2e:only --grep "$native_views" --output=test-results/native-views --reporter=line
                pnpm test:e2e:only --grep-invert "$native_views" --output=test-results/desktop --reporter=line
                exit 0
              fi
              sleep 0.1
            done
            cat /tmp/pi-harness-window-manager.log
            exit 1
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-quality
          overwrite: true
          path: |
            dependency-licenses.json
            test-results/

  package-smoke:
    name: Installed community packages (${{ matrix.platform == 'win32' && 'Windows' || matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
            experimental: false
          - os: macos-15-intel
            platform: darwin
            arch: x64
            experimental: false
          - os: windows-2025
            platform: win32
            arch: x64
            experimental: false
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            experimental: false
          - os: windows-11-arm
            platform: win32
            arch: arm64
            # Keep the installation regression required while downloads remain preview-only.
            experimental: false
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Ad-hoc signing uses no credentials, including on fork pull requests.
      CSC_FOR_PULL_REQUEST: 'true'
      PI_HARNESS_EXPECTED_ARCH: ${{ matrix.arch }}
      PI_HARNESS_RELEASE_CHANNEL: community
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .runtime-cache
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: downloads-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml', 'src/main/runtime/catalog.json') }}
      - run: pnpm install --frozen-lockfile
      - name: Native Windows and environment regressions
        run: pnpm exec vitest run src/main/environment src/main/pi src/main/process --maxWorkers=2
      - name: Verify pinned SDK and native runtime versions
        run: |
          pnpm runtime:prepare
          pnpm runtime:check --offline --native
      - name: Build, install and execute both variants
        if: runner.os != 'Linux'
        run: pnpm release:package
      - name: Build, extract and execute Linux AppImages
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm release:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          overwrite: true
          path: out/community-packages/${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-${{ matrix.platform }}-${{ matrix.arch }}
          overwrite: true
          path: |
            out/community-validation/${{ matrix.platform }}-${{ matrix.arch }}/
            out/runtime-validation/
            test-results/
          if-no-files-found: warn
