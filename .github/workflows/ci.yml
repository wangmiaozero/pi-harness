name: CI / Windows installer validation
on:
  push:
    branches: [codex/windows-upgrade-410336]
concurrency:
  group: installer-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  upgrade:
    name: Windows native installer and upgrade (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
      npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
      npm_config_electron_custom_dir: 'v{{ version }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.12.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .runtime-cache
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: update-upgrade-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Real NSIS process checks and unbounded negative control
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/installer-probes | Out-Null
          pnpm exec node scripts/release/nsis-process-check.mjs --negative-control *> out/installer-probes/probes.log
          $probeExit = $LASTEXITCODE
          Get-Content out/installer-probes/probes.log
          exit $probeExit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: nsis-probes-${{ matrix.arch }}
          path: out/installer-probes/
          retention-days: 3
      - run: pnpm runtime:prepare
      - name: Both variants of the real signed manual upgrade
        shell: pwsh
        run: |
          $stopFile = Join-Path $pwd 'out/installer-probes/stop-monitor'
          $monitor = Start-Job -ArgumentList $stopFile -ScriptBlock {
            param($stopFile)
            while (-not (Test-Path $stopFile)) {
              $records = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -match '^(powershell|node|pi|Pi-Harness|old-uninstaller|Pi-Harness-Setup.*)$' } | ForEach-Object {
                try { [ordered]@{ pid=$_.Id; name=$_.ProcessName; path=$_.Path; cpu=$_.CPU; threads=$_.Threads.Count; title=$_.MainWindowTitle } } catch { }
              })
              @{ time=[DateTime]::UtcNow.ToString('o'); processes=$records } | ConvertTo-Json -Compress -Depth 4
              Start-Sleep -Seconds 10
            }
          }
          try {
            pnpm release:test-upgrade
            $upgradeExit = $LASTEXITCODE
          } finally {
            New-Item -ItemType File -Force $stopFile | Out-Null
            Wait-Job $monitor -Timeout 15 | Out-Null
            if ($monitor.State -eq 'Running') { Stop-Job $monitor }
            Receive-Job $monitor -ErrorAction Continue | Set-Content out/installer-probes/processes.jsonl
            Remove-Job $monitor -Force
          }
          exit $upgradeExit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-upgrade-${{ matrix.arch }}
          path: |
            out/installer-probes/
            out/update-validation/win32-${{ matrix.arch }}/evidence.json
            out/update-validation/win32-${{ matrix.arch }}/upgrade-*.json
            out/update-validation/win32-${{ matrix.arch }}/*.log
            out/update-validation/win32-${{ matrix.arch }}/playwright-*/
          retention-days: 3
