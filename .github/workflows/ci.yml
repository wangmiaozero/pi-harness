name: CI

on:
  push:
    branches: ['codex/ci-41756050666-windows']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-windows:
    name: Focused persistence regressions (Windows-x64)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.12.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused persistence regressions
        run: pnpm exec vitest run src/main/sessions/session-title-service.test.ts src/main/harness/plugins/plugin-registry.test.ts src/main/harness/runs/run-repository.test.ts --maxWorkers=2 --reporter=default --reporter=json --outputFile=out/persistence-tests.json
      - uses: ./.github/actions/upload-artifact-retry
        if: always()
        with:
          name: persistence-regressions-windows-x64
          path: out/persistence-tests.json
