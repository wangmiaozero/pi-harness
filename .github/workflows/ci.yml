name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
  npm_config_electron_custom_dir: 'v{{ version }}'

jobs:
  quality:
    name: Source quality and Electron regression
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.12.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec vitest run --maxWorkers=2
      - run: pnpm audit --prod --audit-level high
      - run: pnpm licenses list --prod --json > dependency-licenses.json
      - run: pnpm compile
      - name: Prepare bundled runtimes for Electron features
        run: pnpm runtime:prepare
      - name: Install the Linux window manager
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openbox wmctrl
      - name: Electron regression (SDK compatibility)
        run: |
          xvfb-run -a bash -e -c '
            openbox --sm-disable > /tmp/pi-harness-window-manager.log 2>&1 &
            for attempt in {1..50}; do
              if wmctrl -m > /dev/null 2>&1; then
                pnpm test:e2e:only
                exit 0
              fi
              sleep 0.1
            done
            cat /tmp/pi-harness-window-manager.log
            exit 1
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: source-quality
          path: |
            dependency-licenses.json
            test-results/

  package-smoke:
    name: Installed community packages (${{ matrix.platform == 'win32' && 'Windows' || matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
            experimental: false
          - os: macos-15-intel
            platform: darwin
            arch: x64
            experimental: false
          - os: windows-2025
            platform: win32
            arch: x64
            experimental: false
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            experimental: false
          - os: windows-11-arm
            platform: win32
            arch: arm64
            experimental: true
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Ad-hoc signing uses no credentials, including on fork pull requests.
      CSC_FOR_PULL_REQUEST: 'true'
      PI_HARNESS_EXPECTED_ARCH: ${{ matrix.arch }}
      PI_HARNESS_RELEASE_CHANNEL: community
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.12.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .runtime-cache
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: downloads-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml', 'src/main/runtime/catalog.json') }}
      - run: pnpm install --frozen-lockfile
      - name: Native Windows and environment regressions
        run: pnpm exec vitest run src/main/environment src/main/pi src/main/process --maxWorkers=2
      - name: Build, install and execute both variants
        if: runner.os != 'Linux'
        run: pnpm release:package
      - name: Build, extract and execute Linux AppImages
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm release:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/community-packages/${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            out/community-validation/${{ matrix.platform }}-${{ matrix.arch }}/
            out/runtime-validation/
            test-results/
          if-no-files-found: warn
