name: Windows ARM64 installer verification
on:
  push:
    branches: [codex/windows-arm64-installer]
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-11-arm
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
      PI_HARNESS_EXPECTED_ARCH: arm64
      PI_HARNESS_RELEASE_CHANNEL: community
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 9.12.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .runtime-cache
            ~/AppData/Local/electron/Cache
          key: downloads-Windows-arm64-${{ hashFiles('pnpm-lock.yaml', 'src/main/runtime/catalog.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:package
      - name: Preserve installer diagnostics
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "$env:LOCALAPPDATA/electron-builder/Cache" -Filter x64.nsh -Recurse | ForEach-Object { Get-Content $_.FullName }
          if (Test-Path "$env:TEMP/pi-nsis-probe.txt") { Get-Content "$env:TEMP/pi-nsis-probe.txt"; Copy-Item "$env:TEMP/pi-nsis-probe.txt" out/community-validation/ }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm64-installer-evidence
          overwrite: true
          path: |
            out/community-validation/
            out/runtime-validation/
            test-results/
