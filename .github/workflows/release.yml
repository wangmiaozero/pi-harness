name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    name: macOS arm64 and x64
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:mac:all
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:win
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.blockmap
            release/latest-linux.yml

  publish:
    name: Publish GitHub Release
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Validate updater artifacts
        working-directory: release-artifacts
        shell: bash
        run: |
          set -euo pipefail
          for file in latest-mac.yml latest.yml latest-linux.yml; do
            test -s "$file" || { echo "Missing required updater metadata: $file" >&2; exit 1; }
          done
          for pattern in '*.zip' '*.zip.blockmap' '*.exe' '*.exe.blockmap' '*.AppImage' '*.AppImage.blockmap'; do
            compgen -G "$pattern" >/dev/null || { echo "Missing required updater payload: $pattern" >&2; exit 1; }
          done
          test "$(find . -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" -ge 2 || {
            echo 'Missing one or more macOS architecture DMGs' >&2
            exit 1
          }
          test "$(find . -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')" -ge 2 || {
            echo 'Missing one or more macOS automatic-update ZIPs' >&2
            exit 1
          }
      - name: Generate SHA256SUMS
        working-directory: release-artifacts
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Prepare public release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          awk -v version="$version" '
            /^## / {
              if (capture) exit
              capture = ($2 == version)
            }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "Missing public changelog for $RELEASE_TAG" >&2; exit 1; }
          unexpected="$(grep '^### ' release-notes.md | grep -Ev '^### (Added|Fixed)$' || true)"
          test -z "$unexpected" || { echo "Release notes may contain only Added and Fixed sections" >&2; exit 1; }
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-artifacts/* --verify-tag --notes-file release-notes.md --title "$RELEASE_TAG"
