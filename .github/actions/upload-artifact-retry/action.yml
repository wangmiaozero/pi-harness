name: Upload artifact with retry
description: Upload a workflow artifact and retry when the upload request fails.

inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: Files, directories or wildcard patterns to upload
    required: true
  if-no-files-found:
    description: Behavior when no files match (warn, error or ignore)
    default: warn
  compression-level:
    description: Zlib compression level for the artifact archive (0-9)
    default: '6'
  overwrite:
    description: Replace an existing artifact with the same name
    default: 'false'

# The artifact client retries HTTP errors but fails immediately on network errors such as
# ENOTFOUND or ECONNRESET, so a brief DNS or connection outage would otherwise fail the job.
# Retries overwrite because a failed attempt can leave a partial artifact with the same name.
# The final attempt does not continue on error, so a persistent failure still fails the job.
runs:
  using: composite
  steps:
    - id: attempt-1
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: ${{ inputs.overwrite }}
    - if: ${{ !cancelled() && steps.attempt-1.outcome == 'failure' }}
      shell: bash
      run: sleep 20
    - id: attempt-2
      if: ${{ !cancelled() && steps.attempt-1.outcome == 'failure' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: true
    - if: ${{ !cancelled() && steps.attempt-2.outcome == 'failure' }}
      shell: bash
      run: sleep 60
    - if: ${{ !cancelled() && steps.attempt-2.outcome == 'failure' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: true
