[package]
name = "pi-harness"
version = "1.6.0"
description = "Desktop Harness & Control Center for Pi Coding Agent (Tauri host)"
authors = ["wangmiao <tuziling84@gmail.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/wangmiaozero/pi-harness"
edition = "2021"
rust-version = "1.82"

[lib]
name = "pi_harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
thiserror = "2"
notify = "6"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["tls"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# strip 不得作用在 proc-macro / build.rs，否则 futures-macro 等
# 会在 release 编不过（E0463 can't find crate）。
[profile.release.build-override]
strip = false
codegen-units = 16
opt-level = 0
